;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;   MONOCHROME — Black & White Theme (High Contrast)
;   Monochrome steel design, solid inverse pill accents.
;
;   Requires:  Symbols Nerd Font Mono  (or any Nerd Font)
;==========================================================

[colors]
; ---- core palette (pure black & white) ----
background     = #000000
background-alt = #0d0d0d
foreground     = #ffffff
foreground-alt = #d0d0d0

; ---- monochrome grays ----
white          = #ffffff
gray-light     = #cccccc
gray           = #999999
gray-dark      = #666666
gray-darker    = #3a3a3a
coal           = #1a1a1a
black          = #000000

; ---- semantic ----
primary        = ${colors.white}
secondary      = ${colors.gray}
alert          = ${colors.white}
disabled       = ${colors.gray-dark}
inverse-fg     = ${colors.black}
inverse-bg     = ${colors.white}

; ==========================================================
;  BAR : main
; ==========================================================
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 22
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.white}

border-size = 0
border-color = ${colors.background}

padding-left = 1
padding-right = 1

module-margin-left = 0.5
module-margin-right = 0.5

; font-0 = main text / font-1 = Nerd Font icons
font-0 = "Adwaita Mono:pixelsize=10;5"
font-1 = "Symbols Nerd Font Mono:pixelsize=9;5"
font-2 = "Noto Color Emoji:pixelsize=8;5"

modules-left   = launcher i3
modules-center = date
modules-right  = network cpu memory filesystem pulseaudio powermenu

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = i3
enable-ipc = true

; ==========================================================
;  MODULES
; ==========================================================

[module/launcher]
type = custom/text
content = ""
content-foreground = ${colors.inverse-fg}
content-background = ${colors.inverse-bg}
content-padding = 3
click-left = rofi -show drun -show-icons

; ---- CLOCK ----
[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d%
time = %H:%M:%S
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.gray}
format = <label>
label = %date%  %time%
label-foreground = ${colors.white}

; ---- workspace indices, inverse pill for the focused one ----
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
enable-click = true
enable-scroll = false

label-focused           = %index%
label-focused-foreground = ${colors.inverse-fg}
label-focused-background = ${colors.inverse-bg}
label-focused-padding   = 2

label-unfocused         = %index%
label-unfocused-foreground = ${colors.gray}
label-unfocused-padding = 2

label-visible           = %index%
label-visible-foreground = ${colors.gray-light}
label-visible-underline = ${colors.gray-dark}
label-visible-padding   = 2

label-urgent            = %index%
label-urgent-foreground = ${colors.inverse-fg}
label-urgent-background = ${colors.inverse-bg}
label-urgent-padding    = 2

; ---- CPU ----
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.gray}
format = <label>
label = %percentage:3%%
label-foreground = ${colors.white}

; ---- MEMORY ----
[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.gray}
format = <label>
label = %percentage_used:3%%
label-foreground = ${colors.white}

; ---- NETWORK (wired) ----
[module/network]
type = internal/network
interface = ${env:NETWORK_INTERFACE:enp2s0}
interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-prefix = "󰛳 "
format-prefix-foreground = ${colors.gray}

format-connected = <label-connected>
label-connected = %downspeed%  %upspeed%

format-disconnected = <label-disconnected>
label-disconnected = offline
label-disconnected-foreground = ${colors.gray-dark}

; ---- FILESYSTEM ----
[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.gray}
format-mounted = <label-mounted>
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.white}

format-unmounted = <label-unmounted>
label-unmounted = n/a
label-unmounted-foreground = ${colors.gray-dark}

; ---- PULSEAUDIO ----
[module/pulseaudio]
type = internal/pulseaudio
interval = 1
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.gray}
format-volume = <label-volume>
label-volume = %percentage%%

format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.gray}
label-muted = muted
label-muted-foreground = ${colors.gray-dark}

; ==========================================================
;  INCLUDES
; ==========================================================
; Power / logout menu lives in its own file next to this one
include-file = powermenu.ini

; ==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0

