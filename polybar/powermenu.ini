;==========================================================
;  POWER MENU — standalone module for polybar
;  Included from config.ini with:  include-file = powermenu.ini
;
;  Items:  logout (exit i3)  ·  restart (reboot)  ·  shutdown
;==========================================================

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1

; --- button drawn on the bar ---
label-open = ""
label-open-foreground = ${colors.white}
label-open-padding = 2

label-close = "6"
label-close-padding = 2

; --- menu entries ---
menu-0-0 = "  logout"
menu-0-0-exec = i3-msg exit

menu-0-1 = "  restart"
menu-0-1-exec = systemctl reboot

menu-0-2 = "5  shutdown"
menu-0-2-exec = systemctl poweroff
